version: "3.9"

services:
  backend:
    build: .
    container_name: steelvision-backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=sqlite:///./sql_app.db
    volumes:
      - ./sql_app.db:/app/sql_app.db
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: steelvision-frontend
    ports:
      - "3000:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
