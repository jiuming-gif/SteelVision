name: SteelVision CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements_full.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn SQLAlchemy pydantic python-dotenv httpx passlib bcrypt python-multipart numpy Pillow requests "langchain==0.3.0" "langchain-openai==0.2.0" "langchain-google-genai==2.0.0" pytest pytest-asyncio
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check main.py agent.py tools.py schemas.py database.py crud.py config.py cv_model_inference.py tests/ --ignore E401,E402,F401

      - name: Run tests
        run: python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
