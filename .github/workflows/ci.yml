name: SteelVision CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements_full.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn SQLAlchemy pydantic python-dotenv httpx passlib bcrypt python-multipart numpy Pillow requests langchain langchain-openai langchain-google-genai pytest pytest-asyncio
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check . --ignore E501,E722,F401,F811,F841 --exclude "tcl8.6,tk8.6,encoding,http1.0,msgs,opt0.4,tzdata"

      - name: Run tests
        run: python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
