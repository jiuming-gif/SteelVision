<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SteelVision — 车辆零部件表面缺陷检测平台</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' },
        surface: { light:'#ffffff', dark:'#1e293b' },
        sidebar: { light:'#f8fafc', dark:'#0f172a' },
      }
    }
  }
}
</script>

<!-- Vue 3 + Vue Router + Axios -->
<script src="https://unpkg.com/vue@3.4/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/vue-router@4.3/dist/vue-router.global.prod.js"></script>
<script src="https://unpkg.com/axios@1.6/dist/axios.min.js"></script>

<!-- ECharts -->
<script src="https://unpkg.com/echarts@5.5/dist/echarts.min.js"></script>

<!-- Font Awesome icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="/web/style.css">
</head>
<body class="bg-gray-100 dark:bg-slate-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">

<div id="app">
  <!-- 侧边栏 -->
  <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-white dark:bg-slate-950 border-r border-gray-200 dark:border-slate-800 flex flex-col z-30 transition-all duration-300 shadow-lg">
    <div class="p-5 border-b border-gray-200 dark:border-slate-800">
      <h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-cyan-500 bg-clip-text text-transparent">
        <i class="fa-solid fa-microchip mr-2"></i>SteelVision
      </h1>
      <p class="text-xs text-gray-400 mt-1">车辆零部件缺陷检测平台</p>
    </div>
    <nav class="flex-1 py-4 space-y-1 px-3">
      <router-link v-for="item in menuItems" :key="item.path" :to="item.path"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200"
        :class="$route.path === item.path
          ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 shadow-sm'
          : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-800 hover:text-gray-900 dark:hover:text-gray-200'">
        <i :class="item.icon" class="w-5 text-center"></i>
        <span>{{ item.label }}</span>
      </router-link>
    </nav>
    <div class="p-4 border-t border-gray-200 dark:border-slate-800">
      <button @click="toggleTheme" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-slate-800 transition-all">
        <i :class="themeIcon" class="w-5 text-center"></i>
        <span>{{ themeLabel }}</span>
      </button>
    </div>
  </aside>

  <!-- 主内容 -->
  <main class="ml-64 min-h-screen p-8 transition-all duration-300">
    <router-view></router-view>
  </main>
</div>

<!-- 组件脚本（先加载组件，再初始化 Vue） -->
<script src="/web/components/SingleDetect.js"></script>
<script src="/web/components/BatchDetect.js"></script>
<script src="/web/components/CameraDetect.js"></script>
<script src="/web/components/AIChat.js"></script>
<script src="/web/components/ResultCharts.js"></script>
<script src="/web/components/AdminPanel.js"></script>
<script src="/web/components/Community.js"></script>
<script src="/web/app.js"></script>

</body>
</html>
